<section id="builder" class="t0-module" data-component="builder">
  <div class="t0-copy"><h2>$heading</h2><p>$intro</p></div>
  <div class="t0-generation">
    <div class="t0-result">$preview</div>
    <div class="t0-prompt" aria-label="$prompt_label">
      <div class="t0-toolbar"><img src="$logo" alt="Tier0" width="64" height="24"><span>App / Builder</span></div>
      <h3>$builder_title</h3>
      <div class="t0-input"><label for="builder-prompt">$prompt_label</label><textarea id="builder-prompt" rows="5">$prompt</textarea><div class="t0-bottom"><span>$app</span><button type="button" disabled data-demo-control data-copy-prompt>$copy_label</button></div></div>
      <p role="status" data-copy-status></p>
    </div>
  </div>
</section>
